name: Build and Deploy (reusable)

# CI -> build services/<service> -> push ghcr.io/<owner>/<service> -> deploy to CapRover.
# CapRover secrets (CAPROVER_SERVER, APP_NAME, CAPROVER_TOKEN) live in the GitHub environment
# `<service>-<environment>`, e.g. ping-api-develop.
on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true
      ref:
        description: Commit SHA to build
        type: string
        required: true
      environment:
        description: develop or production
        type: string
        required: true
      tag:
        description: Moving image tag in addition to the short SHA (latest-develop, pr-12, ...)
        type: string
        required: true

jobs:
  ci:
    uses: ./.github/workflows/_ci.yml
    with:
      service: ${{ inputs.service }}
      ref: ${{ inputs.ref }}

  build-and-deploy:
    needs: ci
    permissions:
      contents: read
      packages: write

    environment:
      name: ${{ inputs.service }}-${{ inputs.environment }}

    # One deploy at a time per service + environment, whether it came from a push or a PR comment
    concurrency:
      group: deploy-${{ inputs.service }}-${{ inputs.environment }}
      cancel-in-progress: false

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Prepare image tags and build args
        id: meta
        env:
          SERVICE: ${{ inputs.service }}
          TAG: ${{ inputs.tag }}
          # Repo + environment variables; service.json buildArgVars picks which ones become build args
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${SERVICE}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "MOVING_TAG=${TAG//\//-}" >> "$GITHUB_ENV"
          {
            echo "build_args<<__EOF__"
            jq -r '.buildArgVars // [] | .[]' "services/${SERVICE}/service.json" | while read -r name; do
              echo "${name}=$(jq -r --arg n "${name}" '.[$n] // ""' <<<"${VARS_JSON}")"
            done
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ inputs.service }}
          file: services/${{ inputs.service }}/Dockerfile
          push: true
          build-args: ${{ steps.meta.outputs.build_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.SHORT_SHA }}
            ${{ env.IMAGE_REPO }}:${{ env.MOVING_TAG }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Deploy image to CapRover
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ secrets.APP_NAME }}
          token: ${{ secrets.CAPROVER_TOKEN }}
          image: ${{ env.IMAGE_REPO }}:${{ env.SHORT_SHA }}
